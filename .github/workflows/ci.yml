name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package --no-dependencies -o phorge-review.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: phorge-review-vsix
          path: phorge-review.vsix
