name: Publish

# Manual: publishes the version currently in package.json to the VS Code
# Marketplace and Open VSX. Requires the VSCE_PAT and OVSX_PAT repository
# secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package --no-dependencies -o phorge-review.vsix
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath phorge-review.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx ovsx publish phorge-review.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
