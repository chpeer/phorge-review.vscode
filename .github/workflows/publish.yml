name: Publish

# Manual: publishes the chosen release tag to the VS Code Marketplace.
# Requires the VSCE_PAT repository secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Check tag matches package.json version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce publish --no-dependencies --oidc

